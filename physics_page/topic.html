<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тема</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="topics/animations.js"></script>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
        }

        .topic-page-shell {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 3rem;
        }

        .topic-card {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.16) 0%, rgba(0, 242, 254, 0.08) 100%);

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #8a2be2;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .topic-title {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .topic-content {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            line-height: 1.8;
            color: #e2e8f0;
        }

        .topic-content p {
            margin: 0;
        }

        .topic-content strong {
            color: #7dd3fc;
        }

        .topic-content .content-block,
        .topic-content>div:not(.content-block) {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
        }
    </style>
</head>

<body>
    <div class="topic-page-shell">
        <div class="topic-card">
            <a class="back-link" href="javascript:history.back()">← Назад</a>
            <h1 class="topic-title" id="topicTitle">Тема</h1>
            <div class="topic-content" id="topicContent"></div>
        </div>
    </div>

    <script>
        // База данных текстов для первых тем по их точному названию
        const topicsDatabase = {
            "Механическое движение: определение": `
                <div class="content-block">
                    <h3>Что такое механическое движение?</h3>
                    <p><strong>Механическое движение</strong> — это изменение положения тела в пространстве относительно других тел с течением времени. Если тело со временем меняет свое местоположение (например, летит мяч, едет машина или бежит человек), значит, оно совершает механическое движение.</p>
                </div>
                <div class="content-block">
                    <h3>Главное правило: относительность</h3>
                    <p>В физике движение всегда рассматривается по отношению к чему-либо. Одно и то же тело может быть неподвижным для одного наблюдателя и движущимся для другого.</p>
                    <p><em>Пример:</em> Пассажир спокойно сидит на кресле внутри едущего поезда. Относительно вагона он находится в <strong>покое</strong>. Но если посмотреть на него из окна платформы, этот же пассажир будет <strong>двигаться</strong> вместе с поездом.</p>
                </div>
                <div class="content-block">
                    <h3>Интерактивная модель</h3>
                    <p>Подвигайте ползунок, чтобы увидеть движение:</p>
                    <canvas id="motionCanvas" width="600" height="180" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); display: block;"></canvas>
                    <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                        <label for="timeSlider" style="color: #7dd3fc;">Время (t): <span id="timeValue">0</span> с</label>
                        <input type="range" id="timeSlider" min="0" max="100" value="0" style="flex: 1; accent-color: #8a2be2; cursor: pointer;">
                    </div>
                </div>`,

            "Тело отсчета": `
                <div class="content-block">
                    <h3>Что такое тело отсчета?</h3>
                    <p>Чтобы описать любое механическое движение, в первую очередь нужно выбрать объект, относительно которого мы будем наблюдать за изменением положения других тел. Этот выбранный предмет и называется <strong>телом отсчета</strong>.</p>
                </div>
                <div class="content-block">
                    <h3>Почему это так важно?</h3>
                    <p>Без указания тела отсчета невозможно определить, движется тело или нет, ведь в природе не существует абсолютного покоя.</p>
                    <p><em>Пример:</em> Вы сидите за столом в кабинете. Относительно стула и стен комнаты вы находитесь в <strong>покое</strong> (тело отсчета — комната). Но если выбрать телом отсчета Солнце, то вы вместе со всей планетой летите в пространстве с огромной скоростью!</p>
                </div>
                <div class="content-block">
                    <h3>Интерактив: выберите свое начало координат</h3>
                    <p>Кликните в <strong>любое место</strong> на холсте ниже, чтобы установить там нулевую отметку (начало отсчета). Вы увидите, как изменится координата движущегося объекта:</p>
                    
                    <canvas id="customOriginCanvas" width="600" height="180" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: block;"></canvas>
                    
                    <p id="coordInfo" style="font-size: 0.95rem; color: #7dd3fc; margin-top: 5px;"></p>
                </div>
            `,

            "Система отсчета": `
                <div class="content-block">
                    <h3>Что входит в систему отсчета?</h3>
                    <p>Чтобы полностью и однозначно описать движение тела в пространстве, одной точки отсчета мало. Необходима целая <strong>система отсчета</strong>, которая состоит из трёх взаимосвязанных элементов:</p>
                    <p style="margin-top: 8px;">1. <strong>Тело отсчета</strong> — объект, относительно которого рассматривается движение.</p>
                    <p>2. <strong>Система координат</strong> (одна ось $OX$, две $OX, OY$ или три) — связана с телом отсчета и позволяет точно измерять положение тела с помощью чисел.</p>
                    <p>3. <strong>Прибор для отсчета времени</strong> (часы) — фиксирует, в какой именно момент времени тело находилось в той или иной точке.</p>
                </div>
                <div class="content-block">
                    <h3>Интерактивная модель: Координатная ось и время</h3>
                    <p>Наглядная модель движения тела на оси координат с отсчетом времени ($t$). Передвигайте ползунок, чтобы увидеть, как меняется положение тела в разные моменты времени:</p>
                    
                    <canvas id="referenceSystemCanvas" width="600" height="160" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); display: block;"></canvas>
                    
                    <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                        <label for="sysTimeSlider" style="color: #7dd3fc;">Время ($t$): <span id="sysTimeValue">0</span> с</label>
                        <input type="range" id="sysTimeSlider" min="0" max="100" value="0" style="flex: 1; accent-color: #8a2be2; cursor: pointer;">
                    </div>
                </div>
            `,
            "Траектория": `
                <div class="content-block">
                    <h3>Что такое траектория?</h3>
                    <p>Когда тело совершает механическое движение, оно переходит из одной точки пространства в другую. Линия, по которой движется тело при своем перемещении, называется <strong>траекторией</strong>.</p>
                </div>
                <div class="content-block">
                    <h3>Виды траекторий</h3>
                    <p>В зависимости от формы линии траектория бывает двух видов:</p>
                    <p style="margin-top: 8px;">1. <strong>Прямолинейная</strong> — если тело движется по прямой линии (например, падение капли дождя без ветра).</p>
                    <p>2. <strong>Криволинейная</strong> — если линия представляет собой кривую (например, поворот машины, полет мяча по дуге или движение точек карусели).</p>
                </div>
                <div class="content-block">
                    <h3>Интерактивная модель: Сравнение траекторий</h3>
                    <p>Нажмите на кнопки ниже, чтобы переключить режим и увидеть разницу между прямолинейным и криволинейным движением:</p>
                    
                    <canvas id="trajectoryCanvas" width="600" height="180" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); display: block;"></canvas>
                    
                    <p id="trajStatus" style="font-size: 0.9rem; color: #7dd3fc; margin-bottom: 10px; min-height: 24px;"></p>

                    <div style="display: flex; gap: 10px;">
                        <button id="btnStraight" style="background: #8a2be2; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">Прямолинейная</button>
                        <button id="btnCurved" style="background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">Криволинейная</button>
                    </div>
                </div>
            `,
            "Путь": `
                <div class="content-block">
                    <h3>Что такое путь?</h3>
                    <p>Длина траектории, по которой движется тело в течение некоторого промежутка времени, называется <strong>путем</strong>.</p>
                    <p style="margin-top: 8px;">Путь обозначается латинской буквой <strong>S</strong>. Главная единица измерения пути в Международной системе единиц (СИ) — <strong>метр (м)</strong>. Также часто используются километры (км), сантиметры (см) и миллиметры (мм).</p>
                </div>
                <div class="content-block">
                    <h3>Особенности пути</h3>
                    <p>1. Путь — это скалярная величина (он имеет только числовое значение и не имеет направления).</p>
                    <p>2. Путь всегда больше нуля (или равен нулю, если тело покоится) и при движении может только увеличиваться.</p>
                </div>
                <div class="content-block">
                    <h3>Интерактивная модель: Измерение пройденного пути</h3>
                    <p>Передвигайте ползунок, чтобы объект двигался по траектории, и наблюдайте, как увеличивается длина пройденного им пути (S):</p>
                    
                    <canvas id="pathCanvas" width="600" height="160" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); display: block;"></canvas>
                    
                    <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                        <label for="pathSlider" style="color: #7dd3fc;">Путь (S): <span id="pathValue">0</span> м</label>
                        <input type="range" id="pathSlider" min="0" max="100" value="0" style="flex: 1; accent-color: #8a2be2; cursor: pointer;">
                    </div>
                </div>
            `,
            "Перемещение: разница между пройденным расстоянием и вектором перемещения": `
                <div class="content-block">
                    <h3>Что такое перемещение?</h3>
                    <p><strong>Перемещение</strong> — это векторная величина, представляющая собой отрезок прямой линии, соединяющий начальное положение тела с его конечным положением.</p>
                    <p style="margin-top: 8px;">Перемещение обозначается буквой <strong>$\vec{s}$</strong> (или $\vec{r}$). В отличие от пути, который учитывает всю извилистую траекторию, перемещение зависит <em>только</em> от начальной и конечной точки.</p>
                </div>
                <div class="content-block">
                    <h3>Главные отличия: путь и перемещение</h3>
                    <p>1. <strong>Путь ($s$)</strong> — скаляр (только число), равен длине траектории. Всегда увеличивается при движении.</p>
                    <p>2. <strong>Перемещение ($\vec{s}$)</strong> — вектор (имеет направление и модуль). Может быть как больше пути, так и меньше его (или даже равным нулю, если тело вернулось обратно).</p>
                </div>
                <div class="content-block">
                    <h3>Интерактивная модель: Путь против Перемещения</h3>
                    <p>Передвигайте ползунок, чтобы увидеть, как тело едет по извилистой траектории (накапливая <strong>путь</strong>), в то время как вектор <strong>перемещения</strong> всегда напрямую соединяет старт и финиш:</p>
                    
                    <canvas id="displacementCanvas" width="600" height="180" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); display: block;"></canvas>
                    
                    <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center; color: #7dd3fc; font-size: 0.95rem;">
                        <span id="pathVsDispText">Путь: 0 м | Перемещение: 0 м</span>
                    </div>
                    <div style="margin-top: 8px; display: flex; align-items: center; gap: 10px;">
                        <label for="dispSlider" style="color: #a78bfa; font-weight: 600;">Время / Прогресс:</label>
                        <input type="range" id="dispSlider" min="0" max="100" value="0" style="flex: 1; accent-color: #8a2be2; cursor: pointer;">
                    </div>
                </div>
            `,
            "Равномерное прямолинейное движение": `
        <div class="content-block">
            <h3>Что такое равномерное прямолинейное движение?</h3>
            <p><strong>Механическое движение</strong> называется <em>равномерным прямолинейным</em>, если за любые равные промежутки времени тело совершает одинаковые перемещения.</p>
            <p style="margin-top: 8px;">Это определение распадается на два важнейших признака:</p>
            <p>1. <strong>Прямолинейное</strong> — траектория движения тела является прямой линией (например, падение капли при полном отсутствии ветра или движение поезда на строго прямом участке рельсов).</p>
            <p>2. <strong>Равномерное</strong> — модуль скорости тела остается постоянным со временем ($v = \text{const}$). Тело не разгоняется и не тормозит.</p>
        </div>

        <div class="content-block">
            <h3>Главные формулы и расчеты</h3>
            <p>Поскольку скорость при таком движении не меняется, путь ($S$), пройденный телом за время ($t$), рассчитывается по формуле:</p>
            <p style="text-align: center; font-size: 1.3rem; color: #7dd3fc; margin: 12px 0;"><strong>$S = v \cdot t$</strong></p>
            <p>Из этой же формулы легко выразить другие физические величины:</p>
            <p style="margin-top: 6px;">• <strong>Скорость ($v$):</strong> $v = \frac{S}{t}$ (измеряется в метрах в секунду, м/с).</p>
            <p>• <strong>Время ($t$):</strong> $t = \frac{S}{v}$ (измеряется в секундах, с).</p>
        </div>

        <div class="content-block">
            <h3>Графики равномерного движения</h3>
            <p>В физике поведение тел очень удобно описывать с помощью графиков:</p>
            <p style="margin-top: 6px;">1. <strong>График скорости ($v$ от $t$):</strong> Представляет собой прямую линию, параллельную оси времени, так как скорость со временем не меняется.</p>
            <p>2. <strong>График пути ($S$ от $t$):</strong> Это прямая линия, выходящая из начала координат. Чем круче наклон этой прямой, тем больше скорость тела.</p>
        </div>

        <div class="content-block">
            <h3>Интерактивная модель: Едет машинка</h3>
            <p>Нажми кнопку <strong>«Старт»</strong> и посмотри, как объект движется с постоянной скоростью. Скорость можно менять с помощью ползунка:</p>
            
            <canvas id="uniformMotionCanvas" width="600" height="160" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); display: block;"></canvas>
            
            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="uniSlider" style="color: #7dd3fc; min-width: 110px;">Скорость (v): <span id="uniValue">2</span></label>
                    <input type="range" id="uniSlider" min="1" max="6" step="0.5" value="2" style="flex: 1; accent-color: #8a2be2; cursor: pointer;">
                </div>
                
                <button id="uniStartBtn" style="background: #8a2be2; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 600; width: fit-content;">Старт движения</button>
            </div>
        </div>
    `,
            "Понятие скорости": `
        <div class="content-block">
            <h3>Что такое скорость?</h3>
            <p><strong>Скорость</strong> — это векторная физическая величина, которая показывает, какой путь тело проходит за единицу времени.</p>
            <p style="margin-top: 8px;">Иными словами, скорость характеризует <em>быстроту</em> движения тела. Чем больше скорость, тем большее расстояние объект преодолевает за одну и ту же секунду (или час).</p>
        </div>

        <div class="content-block">
            <h3>Формула и единицы измерения</h3>
            <p>Чтобы найти модуль скорости (V), нужно пройденный путь (S) разделить на время (t), за которое этот путь был пройден:</p>
            <p style="text-align: center; font-size: 1.3rem; color: #7dd3fc; margin: 12px 0;"><strong>v = S / t</strong></p>
            <p style="margin-top: 8px;">В Международной системе единиц (СИ) основными единицами измерения скорости являются:</p>
            <p>• <strong>метры в секунду (м/с)</strong></p>
            <p>На практике также часто используют внесистемные единицы — <strong>километры в час (км/ч)</strong>.</p>
        </div>

        <div class="content-block">
            <h3>Физический смысл скорости</h3>
            <p>• Если скорость автомобиля равна 60 км/ч, это значит, что за каждый час своего движения он смещается на 60 километров.</p>
            <p>• Если скорость бегуна 5 м/с, это значит, что каждую секунду он преодолевает расстояние в 5 метров.</p>
        </div>

        <div class="content-block">
            <h3>Интерактивная модель: Сравнение скоростей</h3>
            <p>Нажмите <strong>«Старт»</strong>, чтобы запустить два объекта с разной скоростью и наглядно увидеть, как скорость влияет на пройденное за время расстояние:</p>
            
            <canvas id="speedCanvas" width="600" height="180" style="background: rgba(0,0,0,0.4); border-radius: 12px; width: 100%; max-width: 600px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); display: block;"></canvas>
            
            <div style="margin-top: 15px; display: flex; align-items: center; gap: 15px;">
                <button id="speedStartBtn" style="background: #8a2be2; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 600;">Старт гонки</button>
                <span id="speedTimerText" style="color: #7dd3fc; font-size: 0.95rem;">Время: 0.0 с</span>
            </div>
        </div>
    `,
            "Перевод единиц измерения (км/ч в м/с)": `
        <div class="content-block">

            if (title === "Средняя скорость") {
                if (typeof initAverageSpeedAnimation === 'function') {
                    initAverageSpeedAnimation('avgSpeedCanvas', 'avgSpeedStartBtn', 'avgSpeedStatus');
                }
            }
            if (title === "Мгновенная скорость") {
                if (typeof initInstantSpeedAnimation === 'function') {
                    initInstantSpeedAnimation('instantSpeedCanvas', 'instantStartBtn', 'instantStatus');
                }
            }
            if (title === "Инерция") {
                if (typeof initInertiaAnimation === 'function') {
                    initInertiaAnimation('inertiaCanvas', 'inertiaStartBtn', 'inertiaStatus');
                }
            }
            if (title === "Инертность тел") {
                if (typeof initInertiaBodyAnimation === 'function') {
                    initInertiaBodyAnimation('inertiaBodyCanvas', 'inertiaBodyStartBtn', 'inertiaBodyStatus');
                }
            }
            if (title === "Масса как мера инертности") {
                if (typeof initMassMeasureAnimation === 'function') {
                    initMassMeasureAnimation('massMeasureCanvas', 'massMeasureStartBtn', 'massMeasureStatus');
                }
            }
            if (title === "Плотность вещества") {
                if (typeof initDensityAnimation === 'function') {
                    initDensityAnimation('densityCanvas', 'densityStartBtn', 'densityStatus');
                }
            }
        } else {
            topicContent.innerHTML = `
                <div class="content-block">
                    <p>Материал по теме <strong>"${title}"</strong> скоро появится в системе.</p>
                </div>
            `;
        }
    </script>
