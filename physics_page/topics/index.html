<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поле для теста</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
        }
        .topic-page-shell {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 3rem;
        }
        .topic-card {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.16) 0%, rgba(0, 242, 254, 0.08) 100%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #8a2be2;
            text-decoration: none;
            font-weight: 600;
        }
        .topic-title {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .topic-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            line-height: 1.8;
            color: #e2e8f0;
        }
        .topic-content p {
            margin: 0;
        }
        .topic-content strong {
            color: #7dd3fc;
        }
        .topic-content .content-block {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 1rem 1.1rem;
        }
        .test-area textarea::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="topic-page-shell">
        <div class="topic-card">
            <a class="back-link" id="backLink" href="#" data-back-target="../grade-7.html">← Назад к разделу</a>
            <h1 class="topic-title" id="topicTitle">Тема</h1>

            <div class="topic-content" id="topicContent"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'Тема';
        const topicId = params.get('id') || 'topic';
        const from = params.get('from') || '../grade-7.html';
        const storageKey = `phystech_lesson_${topicId}`;

        const titleEl = document.getElementById('topicTitle');
        const backLink = document.getElementById('backLink');
        const topicContent = document.getElementById('topicContent');

        const getTopicContent = (topicTitle) => {
            return '<div class="content-block"><p>Текст учебного материала нужно добавлять на страницу темы через поле «Текст конспекта».</p></div>';
        };

        if (titleEl) titleEl.textContent = title;
        document.title = title;

        if (backLink) {
            backLink.setAttribute('data-back-target', from);
            backLink.href = '#';
            backLink.addEventListener('click', (event) => {
                event.preventDefault();
                const target = backLink.getAttribute('data-back-target') || from;
                if (target && target !== '#') {
                    window.location.assign(new URL(target, window.location.href).toString());
                } else if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.assign('../index.html');
                }
            });
        }

        if (topicContent) {
            topicContent.innerHTML = getTopicContent(title);
        }
    </script>
</body>
</html>
